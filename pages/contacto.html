<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Brote - Contacto</title>
      <link rel="icon" href="../img/icono-logo-brote-sinfondo.png" />

      <link rel="stylesheet" href="../css/style.css" />
      <link rel="stylesheet" href="../css/contacto.css" />
      <script src="https://kit.fontawesome.com/5c1c4a5c1e.js" crossorigin="anonymous"></script>
   </head>
   <body>
      <header>
         <nav class="nav">
            <div class="nav__logo">
               <a href="../index.html">
                  <img
                     src="../img/nuevo-logo-brote-def.png"
                     alt="Brote: Plantas, Ornamentales y Paisajismo"
                     width="200"
                  />
               </a>
            </div>

            <ul class="nav__opciones">
               <li><a href="../index.html">Home</a></li>
               <!-- <li><a href="./catalogo.html">Catálogo</a></li> -->
               <li><a href="./contacto.html">Contacto</a></li>
               <li>
                  <a href="./carrito.html"><i class="fa-solid fa-cart-shopping fa-lg"></i></a>
               </li>
            </ul>
         </nav>
      </header>

      <main class="contenedor">
         <h1 class="contenedor__h1">Contacto</h1>

         <section class="contenedor__seccion">
            <form action="./envio_mensaje.html" method="get" class="contenedor__seccion--form">
               <div class="contenedor__seccion--form-item">
                  <label for="">Nombre</label>
                  <input type="text" maxlength="40" name="nombre" required />
               </div>

               <div class="contenedor__seccion--form-item">
                  <label for="">Apellido</label>
                  <input type="text" maxlength="40" name="apellido" required />
               </div>

               <div class="contenedor__seccion--form-item">
                  <label for="">Email</label>
                  <input type="email" name="email" id="" required />
               </div>

               <div class="contenedor__seccion--form-item">
                  <label for="">Asunto</label>
                  <select name="asunto" id="asunto">
                     <option value="">Seleccione su opción...</option>
                     <option value="soporte">Soporte</option>
                     <option value="consulta">Consulta</option>
                     <option value="otro">Otro</option>
                  </select>
               </div>

               <div class="contenedor__seccion--form-item">
                  <label for="">Cuerpo del Mensaje</label>
                  <textarea name="cuerpo-mensaje" id="" placeholder="Escriba aquí su mensaje.." required></textarea>
               </div>

               <div class="contenedor__seccion--form-btn">
                  <button type="reset" class="btn-neutro">Limpiar</button>
                  <button type="submit" class="btn-verde">Enviar</button>
               </div>
            </form>

            <div class="contenedor__seccion--mapa">
               <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d105073.27456557627!2d-58.51569997166192!3d-34.61579604809792!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcca3b4ef90cbd%3A0xa0b3812e88e88e87!2sBuenos%20Aires%2C%20Cdad.%20Aut%C3%B3noma%20de%20Buenos%20Aires!5e0!3m2!1ses-419!2sar!4v1789048482604!5m2!1ses-419!2sar"
                  width="600"
                  height="450"
                  style="border: 0"
                  allowfullscreen=""
                  loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
               ></iframe>
            </div>
         </section>
      </main>

      <footer>
         <div class="footer__contenedor">
            <div class="footer__contenedor--logo">
               <img src="../img/icono-logo-brote-sinfondo.png" alt="Logo Simplificao de Brote" width="200" />
               <p>Diseño, direccion, ejecucion y mantenimientos de espacios verdes.</p>
            </div>

            <div class="footer__contenedor-nav-redes">
               <nav class="footer__contenedor--nav">
                  <p>Mapa de Sitio</p>
                  <hr />
                  <ul class="footer__contenedor--nav-opciones">
                     <li><a href="../index.html">Home</a></li>
                     <!-- <li><a href="./catalogo.html">Catálogo</a></li> -->
                     <li><a href="./contacto.html">Contacto</a></li>
                     <li><a href="./carrito.html">Carrito</a></li>
                  </ul>
               </nav>

               <div class="footer__contenedor--redes">
                  <p>¡Seguinos en redes sociales!</p>
                  <hr />
                  <div class="footer__contenedor--redes--link">
                     <a href="#"><i class="fa-brands fa-instagram fa-2x"></i> Instagram</a>
                  </div>
                  <div class="footer__contenedor--redes--link">
                     <a href="#"><i class="fa-brands fa-youtube fa-2xl"></i> Youtube</a>
                  </div>
                  <div class="footer__contenedor--redes--link">
                     <a href="#"><i class="fa-brands fa-square-facebook fa-2xl"></i> Facebook</a>
                  </div>
                  <div class="footer__contenedor--redes--link">
                     <a href="#"><i class="fa-brands fa-square-linkedin fa-2xl"></i> LinkedIn</a>
                  </div>
               </div>
            </div>
         </div>

         <hr />

         <div class="footer__legales">
            <p>Brote. Todos los Derechos Reservados. 2026</p>
         </div>
      </footer>
   </body>
</html>
